name: Deploy GabikOS to GitHub Pages

on:
  push:
    branches: [main, master, claude/gabikos-lifestyle-system-8h5y2j]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish; queue at most one more
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # enablement:true turns Pages on automatically, so there is no
      # setting to flip by hand before the first run
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # the site is already static — publish the repo as-is
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
