name: Deploy GabikOS to GitHub Pages

on:
  push:
    branches: [main, master, claude/gabikos-lifestyle-system-8h5y2j]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish; queue at most one more
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A vercel.json Vercel refuses is invisible: that deployment fails and
      # the previous build keeps serving, so the site simply stops changing
      # with nothing on it to say so. Fail here instead, where it shows up as
      # a red cross on the commit.
      - name: Check the deployment config
        run: node tools/check-config.mjs

      # No enablement flag here: GITHUB_TOKEN cannot create a Pages site
      # ("Resource not accessible by integration"), on public repos too.
      # A repo admin switches Pages on once, under
      # Settings -> Pages -> Source: GitHub Actions. This step then just
      # reads that config.
      - uses: actions/configure-pages@v5

      # the site is already static — publish the repo as-is
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
