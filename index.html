<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="GabikOS — a personal operating system for your whole life." />
<meta name="theme-color" content="#0a0b0f" />
<title>GabikOS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%237c5cff'/><text y='70' x='50' text-anchor='middle' font-size='56' font-family='system-ui' font-weight='700' fill='white'>G</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/base.css" />
<link rel="stylesheet" href="styles/shell.css" />
<link rel="stylesheet" href="styles/components.css" />
<link rel="stylesheet" href="styles/apps.css" />
</head>
<body>

<!-- ─── Boot screen ─────────────────────────────────────────── -->
<div id="boot" class="boot">
  <div class="boot__inner">
    <div class="boot__logo">G</div>
    <div class="boot__name">GabikOS</div>
    <div class="boot__bar"><i></i></div>
    <div class="boot__hint">your life, organised</div>
  </div>
</div>

<!-- ─── App shell ───────────────────────────────────────────── -->
<div id="shell" class="shell" hidden>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__head">
      <div class="brand" data-nav="dashboard">
        <div class="brand__mark">G</div>
        <div class="brand__text">
          <strong>GabikOS</strong>
          <span id="brandSub">personal system</span>
        </div>
      </div>
      <button class="icon-btn sidebar__collapse" id="collapseBtn" title="Collapse sidebar (Ctrl+B)"></button>
    </div>

    <nav class="nav" id="nav"><!-- rendered --></nav>

    <div class="sidebar__foot">
      <button class="profile-chip" id="profileChip">
        <span class="avatar" id="navAvatar">G</span>
        <span class="profile-chip__txt">
          <strong id="navName">Gabik</strong>
          <small id="navStreak">—</small>
        </span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" title="Menu"></button>

      <button class="searchbar" id="searchBtn">
        <svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Search or run a command…</span>
        <kbd>Ctrl</kbd><kbd>K</kbd>
      </button>

      <div class="topbar__right">
        <button class="icon-btn" id="focusBtn" title="Start a focus session"></button>
        <button class="icon-btn" id="themeBtn" title="Toggle theme"></button>
        <button class="btn btn--primary btn--sm" id="quickAddBtn">
          <svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg>
          <span class="hide-sm">Create</span>
        </button>
      </div>
    </header>

    <main class="view" id="view"><!-- rendered --></main>
  </div>

  <div class="scrim" id="scrim"></div>
</div>

<!-- ─── Overlays ────────────────────────────────────────────── -->
<div class="palette" id="palette" hidden>
  <div class="palette__box">
    <div class="palette__input">
      <svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="paletteInput" placeholder="Search everything, or type a command…" autocomplete="off" spellcheck="false" />
      <kbd>Esc</kbd>
    </div>
    <div class="palette__results" id="paletteResults"></div>
    <div class="palette__foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>Esc</kbd> close</span>
    </div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal__box" id="modalBox">
    <div class="modal__head">
      <h3 id="modalTitle">Title</h3>
      <button class="icon-btn" id="modalClose"></button>
    </div>
    <div class="modal__body" id="modalBody"></div>
    <div class="modal__foot" id="modalFoot"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<div class="focus-hud" id="focusHud" hidden>
  <div class="focus-hud__ring"><svg viewBox="0 0 44 44"><circle class="fh-bg" cx="22" cy="22" r="19"/><circle class="fh-fg" cx="22" cy="22" r="19" id="fhRing"/></svg><span id="fhTime">25:00</span></div>
  <div class="focus-hud__meta"><strong id="fhLabel">Focus</strong><small id="fhTask">Deep work</small></div>
  <button class="icon-btn" id="fhToggle" title="Pause"></button>
  <button class="icon-btn" id="fhStop" title="Stop"></button>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
